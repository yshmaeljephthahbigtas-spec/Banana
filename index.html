<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- EDIT WEBSITE NAME HERE -->
  <title>Banana</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- =========================
       NAVBAR
       Edit the website name/menu here
  ========================== -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Banana</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#about">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- =========================
       HERO / MAIN TITLE
       Change the text below anytime
  ========================== -->
  <header id="home" class="hero-section text-center">
    <div class="container py-5">
      <h1 class="display-4 fw-bold">Welcome to Banana</h1>
      <p class="lead">A simple Bootstrap website that is easy to update.</p>
      <a href="#about" class="btn btn-primary btn-lg">Learn More</a>
    </div>
  </header>

  <!-- =========================
       ABOUT SECTION
       Replace this with your real content later
  ========================== -->
  <section id="about" class="py-5">
    <div class="container">
      <h2>About Banana</h2>
      <p>
        Put your website description here. You can replace this text anytime.
      </p>
    </div>
  </section>

  <!-- =========================
       ADD NEW SECTIONS BELOW
       Copy this example when needed:

  <section class="py-5">
    <div class="container">
      <h2>New Section</h2>
      <p>Your content here.</p>
    </div>
  </section>

  ========================== -->

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <small>&copy; 2026 Banana. All rights reserved.</small>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your custom JavaScript -->
  <script src="js/script.js"></script>
</body>
</html>
